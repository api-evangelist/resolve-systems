aid: resolve-systems
name: Resolve Systems
description: >-
  Resolve Systems (resolve.io) is an enterprise IT automation and AIOps platform
  that helps IT and operations teams automate incident resolution, service-desk
  workflows, and cross-domain remediation at scale. Its "Agentic Resolution
  Fabric" combines a Knowledge Agent (contextual answers across chat, portals,
  and collaboration tools), an Automation Agent (autonomous cross-domain
  workflows that remediate, configure, and orchestrate IT processes in real
  time), and Agent Assist (enriched diagnostics, related incidents, and
  next-best actions). Product lines include Resolve Actions, Actions Pro,
  Actions Express, and Barista, spanning IT process automation (ITPA), robotic
  process automation, and agentic service management. The company positions
  itself around cutting manual tickets by up to 90% and reports large aggregate
  customer savings. Resolve is a portfolio company of Insight Partners. This
  profile was enriched from public web sources; Resolve does not appear to
  publish a public, self-service developer API, OpenAPI definition, or open
  developer portal — integration and automation are delivered through the
  platform's connectors and customer-gated documentation.
